name: Build MyAI Embedded Gateway APK (MyAI.zip / MyAl.zip)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - MyAI.zip
      - MyAl.zip
      - .github/workflows/build-myai-embedded-apk.yml

permissions:
  contents: read

concurrency:
  group: myai-embedded-gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ROOT: ${{ github.workspace }}/.ci-extracted
  EXPECTED_APPLICATION_ID: com.efhc.myai
  EXPECTED_MIN_SDK: "26"
  EXPECTED_TARGET_SDK: "35"
  EXPECTED_FREEAPI_VERSION: v0.12.0
  EXPECTED_NODE_MOBILE_VERSION: v24.21.0-0
  EXPECTED_NODE_MOBILE_SHA256: e3cd29a1be03405f11dd5c857af8cd3ad13f84f1409ea648f5328f0bada5bd76

jobs:
  build-apk:
    name: Validate, assemble and verify MyAI embedded gateway APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve source archive
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          FOUND=()
          [[ -f "MyAI.zip" ]] && FOUND+=("MyAI.zip")
          [[ -f "MyAl.zip" ]] && FOUND+=("MyAl.zip")

          if [[ "${#FOUND[@]}" -eq 0 ]]; then
            echo "ERROR: source archive not found. Expected exactly one of: MyAI.zip or MyAl.zip"
            exit 1
          fi

          if [[ "${#FOUND[@]}" -ne 1 ]]; then
            echo "ERROR: both MyAI.zip and MyAl.zip are present. Keep exactly one source archive to avoid ambiguous builds."
            printf 'Found: %s\n' "${FOUND[@]}"
            exit 1
          fi

          SOURCE_ARCHIVE="${FOUND[0]}"
          echo "SOURCE_ARCHIVE=$SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          echo "source_archive=$SOURCE_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "[PASS] selected source archive: $SOURCE_ARCHIVE"

      - name: Verify source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${SOURCE_ARCHIVE:-}" || { echo "ERROR: SOURCE_ARCHIVE was not resolved."; exit 1; }
          test -f "$SOURCE_ARCHIVE" || { echo "ERROR: resolved archive $SOURCE_ARCHIVE not found in repository root."; exit 1; }
          unzip -t "$SOURCE_ARCHIVE"
          sha256sum "$SOURCE_ARCHIVE" | tee SOURCE_ARCHIVE.sha256
          echo "[PASS] source archive exists: $SOURCE_ARCHIVE"
          echo "[PASS] ZIP integrity"

      - name: Extract Cycle 03 source
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          unzip -q "$SOURCE_ARCHIVE" -d "$BUILD_ROOT"

          mapfile -t SETTINGS_FILES < <(
            find "$BUILD_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort
          )
          test "${#SETTINGS_FILES[@]}" -eq 1 || {
            echo "ERROR: expected exactly one Gradle root, found ${#SETTINGS_FILES[@]}."
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          }

          PROJECT_ROOT="$(dirname "${SETTINGS_FILES[0]}")"
          test -f "$PROJECT_ROOT/app/build.gradle.kts" || { echo "ERROR: app/build.gradle.kts missing."; exit 1; }
          test -f "$PROJECT_ROOT/tools/build-freeapi.sh" || { echo "ERROR: tools/build-freeapi.sh missing."; exit 1; }
          test -f "$PROJECT_ROOT/tools/build-mobile-server.mjs" || { echo "ERROR: tools/build-mobile-server.mjs missing."; exit 1; }
          test -f "$PROJECT_ROOT/tools/prepare-node-runtime.sh" || { echo "ERROR: tools/prepare-node-runtime.sh missing."; exit 1; }
          test -f "$PROJECT_ROOT/tools/mobile-server-host.template.ts" || { echo "ERROR: mobile server host template missing."; exit 1; }
          test -f "$PROJECT_ROOT/app/src/main/cpp/native-lib.cpp" || { echo "ERROR: JNI bridge missing."; exit 1; }

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "[PASS] Cycle 03 project structure"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate pinned runtime and Android embedding contract
        shell: bash
        working-directory: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail
          grep -Fq "REF=\"${EXPECTED_FREEAPI_VERSION}\"" tools/build-freeapi.sh || {
            echo "ERROR: FreeLLMAPI version is not pinned to $EXPECTED_FREEAPI_VERSION."
            exit 1
          }
          grep -Fq "VERSION=\"${EXPECTED_NODE_MOBILE_VERSION}\"" tools/prepare-node-runtime.sh || {
            echo "ERROR: Node mobile version is not pinned to $EXPECTED_NODE_MOBILE_VERSION."
            exit 1
          }
          grep -Fq "SHA256=\"${EXPECTED_NODE_MOBILE_SHA256}\"" tools/prepare-node-runtime.sh || {
            echo "ERROR: Node mobile SHA-256 pin does not match CI contract."
            exit 1
          }
          grep -Fq 'rootDir.absolutePath' app/src/main/java/com/efhc/myai/GatewayRuntime.kt || {
            echo "ERROR: Android app-private gateway root is not passed to embedded Node."
            exit 1
          }
          grep -Fq 'process.argv[2]' tools/mobile-server-host.template.ts || {
            echo "ERROR: mobile server host does not consume the Android gateway root argument."
            exit 1
          }
          grep -Fq 'std::vector<char> argvBuffer' app/src/main/cpp/native-lib.cpp || {
            echo "ERROR: JNI argv is not staged in one contiguous writable buffer."
            exit 1
          }
          echo "[PASS] FreeLLMAPI pin = $EXPECTED_FREEAPI_VERSION"
          echo "[PASS] Node mobile pin = $EXPECTED_NODE_MOBILE_VERSION"
          echo "[PASS] Node mobile SHA-256 pin"
          echo "[PASS] Android embedded-runtime contract"

      - name: Build FreeLLMAPI mobile bundle
        working-directory: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail
          chmod +x tools/build-freeapi.sh tools/prepare-node-runtime.sh
          tools/build-freeapi.sh
          test -s app/src/main/assets/node-project/server.mjs || {
            echo "ERROR: FreeLLMAPI server bundle was not generated."
            exit 1
          }
          echo "[PASS] FreeLLMAPI embedded server bundle"

      - name: Verify generated gateway bundle contract
        working-directory: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail
          grep -Fq '127.0.0.1' app/src/main/assets/node-project/server.mjs || {
            echo "ERROR: generated bundle does not contain loopback binding evidence."
            exit 1
          }
          grep -Fq 'FREEAPI_DB_PATH' app/src/main/assets/node-project/server.mjs || {
            echo "ERROR: generated bundle does not contain Android DB path configuration."
            exit 1
          }
          grep -Fq 'MYAI_GATEWAY_ROOT' app/src/main/assets/node-project/server.mjs || {
            echo "ERROR: generated bundle lost app-private root configuration."
            exit 1
          }
          test -s app/src/main/assets/node-project/version.txt || {
            echo "ERROR: node-project/version.txt missing."
            exit 1
          }
          echo "[PASS] embedded gateway bundle contract"

      - name: Stage pinned Node mobile runtime
        working-directory: ${{ steps.project.outputs.project_root }}
        run: |
          set -Eeuo pipefail
          tools/prepare-node-runtime.sh
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "app/src/main/jniLibs/$abi/libnode.so" || {
              echo "ERROR: libnode.so missing for $abi."
              exit 1
            }
          done
          test -f app/src/main/libnode/include/node/node.h || {
            echo "ERROR: Node headers missing."
            exit 1
          }
          echo "[PASS] embedded Node mobile runtime"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.3.13750724
            cmake;3.22.1
          log-accepted-android-sdk-licenses: "false"

      - name: Verify Android build toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "ERROR: Android platform 35 missing."; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "ERROR: Build Tools 35.0.0 missing."; exit 1; }
          test -d "$ANDROID_HOME/ndk/27.3.13750724" || { echo "ERROR: NDK 27.3.13750724 missing."; exit 1; }
          test -d "$ANDROID_HOME/cmake/3.22.1" || { echo "ERROR: CMake 3.22.1 missing."; exit 1; }
          echo "[PASS] Android SDK 35 / Build Tools 35.0.0 / NDK 27.3 / CMake 3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Validate Android source configuration
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --version
          grep -Fq 'applicationId = "com.efhc.myai"' app/build.gradle.kts || { echo "ERROR: applicationId mismatch."; exit 1; }
          grep -Fq 'minSdk = 26' app/build.gradle.kts || { echo "ERROR: minSdk mismatch."; exit 1; }
          grep -Fq 'targetSdk = 35' app/build.gradle.kts || { echo "ERROR: targetSdk mismatch."; exit 1; }
          grep -Fq 'id("org.jetbrains.kotlin.android") version "2.2.21" apply false' build.gradle.kts || { echo "ERROR: Kotlin Gradle plugin compatibility pin mismatch."; exit 1; }
          test -f app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml || { echo "ERROR: INTERNET permission missing."; exit 1; }
          grep -Fq 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml || { echo "ERROR: loopback cleartext traffic is not enabled."; exit 1; }
          echo "[PASS] Android source configuration"

      - name: Build, test, lint and assemble debug APK
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace \
            clean \
            testDebugUnitTest \
            lintDebug \
            compileDebugKotlin \
            assembleDebug
          echo "[PASS] Gradle unit tests"
          echo "[PASS] Android lint"
          echo "[PASS] Kotlin compilation"
          echo "[PASS] JNI/CMake compilation and APK assembly"

      - name: Verify APK contents and metadata
        id: artifact
        working-directory: ${{ steps.project.outputs.project_root }}
        env:
          EXPECTED_APPLICATION_ID: ${{ env.EXPECTED_APPLICATION_ID }}
          EXPECTED_MIN_SDK: ${{ env.EXPECTED_MIN_SDK }}
          EXPECTED_TARGET_SDK: ${{ env.EXPECTED_TARGET_SDK }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-artifact"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "ERROR: APK not found: $APK"; exit 1; }

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT2" || { echo "ERROR: aapt2 not found."; exit 1; }
          test -x "$APKSIGNER" || { echo "ERROR: apksigner not found."; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUTPUT_DIR/APKSIGNER_VERIFY.txt"
          "$AAPT2" dump badging "$APK" > "$OUTPUT_DIR/AAPT_BADGING.txt"
          "$AAPT2" dump permissions "$APK" > "$OUTPUT_DIR/AAPT_PERMISSIONS.txt"

          APP_ID="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$OUTPUT_DIR/AAPT_BADGING.txt" | head -1)"
          VERSION_CODE="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" "$OUTPUT_DIR/AAPT_BADGING.txt" | head -1)"
          VERSION_NAME="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" "$OUTPUT_DIR/AAPT_BADGING.txt" | head -1)"
          MIN_SDK="$(sed -n "s/^sdkVersion:'\\([^']*\\)'.*/\\1/p" "$OUTPUT_DIR/AAPT_BADGING.txt" | head -1)"
          TARGET_SDK="$(sed -n "s/^targetSdkVersion:'\\([^']*\\)'.*/\\1/p" "$OUTPUT_DIR/AAPT_BADGING.txt" | head -1)"

          test "$APP_ID" = "$EXPECTED_APPLICATION_ID" || { echo "ERROR: applicationId=$APP_ID expected=$EXPECTED_APPLICATION_ID"; exit 1; }
          test "$MIN_SDK" = "$EXPECTED_MIN_SDK" || { echo "ERROR: minSdk=$MIN_SDK expected=$EXPECTED_MIN_SDK"; exit 1; }
          test "$TARGET_SDK" = "$EXPECTED_TARGET_SDK" || { echo "ERROR: targetSdk=$TARGET_SDK expected=$EXPECTED_TARGET_SDK"; exit 1; }

          unzip -l "$APK" | awk '{print $4}' | grep -Fxq 'assets/node-project/server.mjs' || { echo "ERROR: server.mjs is not embedded."; exit 1; }
          unzip -l "$APK" | awk '{print $4}' | grep -Fxq 'assets/node-project/version.txt' || { echo "ERROR: bundle version marker is not embedded."; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | awk '{print $4}' | grep -Fxq "lib/$abi/libnode.so" || { echo "ERROR: $abi libnode.so is not embedded."; exit 1; }
            unzip -l "$APK" | awk '{print $4}' | grep -Fxq "lib/$abi/libmyai_native.so" || { echo "ERROR: $abi JNI bridge is not embedded."; exit 1; }
          done

          grep -q 'android.permission.INTERNET' "$OUTPUT_DIR/AAPT_PERMISSIONS.txt" || {
            echo "ERROR: APK lost INTERNET permission required for provider access."
            exit 1
          }

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          cp "$APK" "$OUTPUT_DIR/MyAI-Cycle03-EmbeddedGateway-debug.apk"
          printf '%s  %s\n' "$APK_SHA256" 'MyAI-Cycle03-EmbeddedGateway-debug.apk' > "$OUTPUT_DIR/APK_SHA256SUMS.txt"

          cat > "$OUTPUT_DIR/BUILD_REPORT.txt" <<EOF_REPORT
          Product: MyAI
          Source archive: $SOURCE_ARCHIVE
          Cycle: 03 Embedded Gateway
          Build class: DEBUG
          Application ID: $APP_ID
          Version code: $VERSION_CODE
          Version name: $VERSION_NAME
          Min SDK: $MIN_SDK
          Target SDK: $TARGET_SDK
          FreeLLMAPI: $EXPECTED_FREEAPI_VERSION
          Node mobile: $EXPECTED_NODE_MOBILE_VERSION
          Embedded server bundle: PASS
          Embedded libnode.so: PASS
          Embedded JNI bridge: PASS
          APK signature verification: PASS
          APK SHA-256: $APK_SHA256
          Physical Android acceptance: NOT VERIFIED BY CI
          EOF_REPORT

          echo "artifact_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_name=MyAI-Cycle03-EmbeddedGateway-debug" >> "$GITHUB_OUTPUT"
          cat "$OUTPUT_DIR/BUILD_REPORT.txt"

      - name: Upload MyAI APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Mark MyAI embedded gateway build PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[PASS] MyAI Cycle 03 Embedded Gateway APK artifact uploaded"
          echo "MYAI_CYCLE03_EMBEDDED_GATEWAY_APK_PASS"
